name: Update RSS feedon:  schedule:    # GitHub scheduler re-registration: run twice per hour, away from peak times.    - cron: "17,47 * * * *"      timezone: "Asia/Tokyo"  workflow_dispatch:  push:    branches: [main]permissions:  contents: read  pages: write  id-token: writeconcurrency:  group: pages  cancel-in-progress: truejobs:  build-and-deploy:    runs-on: ubuntu-latest    environment:      name: github-pages      url: ${{ steps.deployment.outputs.page_url }}    steps:      - uses: actions/checkout@v6      - uses: actions/setup-python@v6        with:          python-version: "3.13"      - name: Generate feed        run: python generate_feed.py      - uses: actions/configure-pages@v5      - uses: actions/upload-pages-artifact@v4        with:          path: public      - name: Deploy to GitHub Pages
